{% extends('base.html') %}

{% block header %} 
    <h1>Contacto</h1>
{% endblock %}

{% block content %}
<section class="contact-card">
    <h2>Contáctanos</h2>
    <p>¿Tienes alguna duda, sugerencia o problema con tu cuenta? Envíanos un mensaje y te responderemos a la brevedad.
    </p>

    <form action="/enviar-contacto" method="POST">
        <div class="form-group">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ej. Ana García" required>
        </div>

        <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" placeholder="Ej. ana@ejemplo.com" required>
        </div>

        <div class="form-group">
            <label for="asunto">Motivo de contacto</label>
            <select id="asunto" name="asunto" required>
                <option value="" disabled selected>Selecciona una opción</option>
                <option value="consulta">Consulta general</option>
                <option value="sugerencia">Sugerencia de libro</option>
                <option value="soporte">Soporte técnico</option>
                <option value="otro">Otro</option>
            </select>
        </div>

        <div class="form-group">
            <label for="mensaje">Mensaje</label>
            <textarea id="mensaje" name="mensaje" placeholder="Escribe tu mensaje aquí..." required></textarea>
        </div>

        <button class="submit-button" type="submit">Enviar mensaje</button>
    </form>
</section>
{% endblock %}
